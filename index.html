<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Order with Ro6ie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@1,700;1,900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: single phone-first column, three service "slates" up top, form below, sticky total bar at the bottom */
:root{
  --bg:#0F0E0E; --surface:#221E1D; --sunk:#2C2726; --ink:#F6F3F2; --muted:#B3ABA8; --line:#3A3433;
  --accent:#E00505; --accent-soft:#3A1412; --accent-ink:#FFFFFF;
  --warn:#FFB547; --warn-soft:#2E2414; --bad:#FF5A5A; --good:#5ECB91; --good-soft:#163527;
  --display:"Archivo","DejaVu Sans Condensed",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-block:16px 140px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.head{display:flex;align-items:center;gap:12px}
.mark{font-style:italic;width:42px;height:42px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px}
.head b{font-family:var(--display);font-style:italic;font-weight:900;font-size:20px;letter-spacing:-.02em;display:block;line-height:1.1}
.head small{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-style:italic;font-weight:900;text-transform:uppercase;color:var(--accent);font-size:clamp(32px,8vw,46px);line-height:1;letter-spacing:-.035em;margin:0;text-wrap:balance}
.lede{margin:8px 0 0;color:var(--muted);max-width:52ch}

.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pick{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.pick b{font-family:var(--display);font-style:italic;font-weight:900;text-transform:uppercase;font-size:18px;letter-spacing:-.02em}
.pick span{font-size:12.5px;color:var(--muted);line-height:1.35}
.pick .from{font-family:var(--mono);font-size:11.5px;color:var(--accent);margin-top:auto;padding-top:6px}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:480px){.picks{grid-template-columns:1fr}.pick{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 10px}.pick span{flex-basis:100%}.pick .from{margin-left:auto;padding-top:0}.pick span{order:3}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px}
.card h2{font-family:var(--display);font-style:italic;font-weight:900;text-transform:uppercase;font-size:20px;letter-spacing:-.02em;margin:0}
.card h2 small{display:block;font-style:normal;text-transform:none;font-family:var(--body);font-size:13.5px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.f label i{font-style:normal;color:var(--bad)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.f textarea{min-height:110px;resize:vertical}
.f .hint{font-size:13px;color:var(--muted)}
.f.err input,.f.err select,.f.err textarea{border-color:var(--bad)}
.f .msg{font-size:13px;color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;background:var(--bg)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt b{font-weight:600}
.opt .pr{margin-left:auto;font-family:var(--mono);font-size:13px;white-space:nowrap}
.opt span.d{display:block;font-size:13px;color:var(--muted)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.must{border:1.5px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.must b{font-family:var(--display);font-style:italic;font-size:16px}
.must ul{margin:0;padding-left:18px;font-size:14px}
.must label{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:14.5px;cursor:pointer}
.must input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.must.err{border-color:var(--bad)}
.toggle{display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer}
.toggle input{accent-color:var(--accent);width:18px;height:18px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
.bar .l{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bar .t{font-family:var(--display);font-style:italic;font-size:26px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pay{background:#FFC439;border-color:#FFC439;color:#111}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.review{display:flex;flex-direction:column;gap:16px}
.summary{white-space:pre-wrap;font-family:var(--mono);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0;overflow-wrap:anywhere}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.steps li::marker{font-family:var(--mono);color:var(--accent);font-weight:600}
.contact{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:15px}
.contact .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.contact .v{font-weight:600;user-select:all;overflow-wrap:anywhere}
.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:13.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;font-size:14px}
.paygrid{display:grid;grid-template-columns:1fr;gap:10px}
.payopt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.payopt b{font-family:var(--display);font-style:italic;font-weight:900;text-transform:uppercase;font-size:16px}
.payopt .v{font-family:var(--mono);font-size:15px;font-weight:600;user-select:all}
.hero{display:block;width:100%;max-width:100%;aspect-ratio:900/697;object-fit:cover;object-position:center 30%;border-radius:14px;border:1px solid var(--line)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.drop{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:22px 14px;background:var(--bg);cursor:pointer}
.drop b{font-family:var(--display);font-style:italic;font-weight:900;text-transform:uppercase;color:var(--accent);font-size:16px}
.drop span{font-size:13px;color:var(--muted)}
.drop:hover,.drop.over,#up:focus-visible + .drop{border-color:var(--accent)}
.thumbs{display:flex;flex-direction:column;gap:8px}
.thumb{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--bg)}
.thumb img,.thumb .ext{width:48px;height:48px;border-radius:6px;object-fit:cover;background:var(--sunk);display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--muted)}
.thumb .meta{min-width:0;display:flex;flex-direction:column}
.thumb .meta span{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb .meta small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.textto{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.textto .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.textto .v{font-family:var(--display);font-style:italic;font-weight:900;font-size:22px;user-select:all;flex:1}
.btn.big{width:100%;padding:16px;font-size:18px;font-family:var(--display);font-style:italic;font-weight:900;text-transform:uppercase}
footer.foot{font-size:13px;color:var(--muted);text-align:center}
</style>

<div class="wrap" id="app"></div>
<div class="bar" id="bar"><div class="in">
  <div><div class="l">Estimate</div><div class="t" id="total">$0</div></div>
  <button class="btn primary" id="go">Review order</button>
</div></div>

}

    <div class="f" data-f="svc"><label for="svc">Service <i>*</i></label><select id="svc"><option value="">Choose a service</option>${BOOK.map(g=>`<optgroup label="${g.g}">${g.items.map(i=>`<option value="${i.id}" ${val("svc")===i.id?"selected":""}>${esc(i.n)} · ${usd(i.p)}</option>`).join("")}</optgroup>`).join("")}</select>${s&&s.d?`<span class="hint">${esc(s.d)}. Time over an hour rounds up.</span>`:""}<span class="msg"></span></div>

function consultForm(){
  return `<section class="card"><h2>Something not listed?<small>Tell Will what you have in mind and he'll text you an estimate. No payment needed yet.</small></h2>
    ${field("need","What do you need?",{type:"textarea",req:true,ph:"Describe the project: what it is, what you want made, how many pieces…"})}
    <div class="grid2">
      <div class="f" data-f="forwho"><label for="forwho">It's for</label><select id="forwho">${["","An artist / music","A business / brand","An event / club","Something else"].map(o=>`<option value="${o}" ${val("forwho")===o?"selected":""}>${o||"Choose one"}</option>`).join("")}</select></div>
      <div class="f" data-f="budget"><label for="budget">Budget</label><select id="budget">${["","Under $250","$250–$500","$500–$1,000","$1,000+","Not sure yet"].map(o=>`<option value="${o}" ${val("budget")===o?"selected":""}>${o||"Choose one"}</option>`).join("")}</select></div>

    ${upbox()}

function pick(){
  if(S.type==="consult") return null;
  if(S.type==="vfx") return VFX.find(x=>x.id===val("svc"));
  if(S.type==="cover") return COVER.find(x=>x.id===val("svc"));
  return BOOKMAP[val("svc")];
}
function estimate(){
  const s = pick(); if(!s) return 0;
  let p = s.p;
  if(val("haslogo")==="make") p += LOGO_FEE;
  if(s.x){ const h=Math.ceil(Number(val("hours"))||s.bh); if(h>s.bh) p+=(h-s.bh)*s.x; }
  p=Math.round(p*(1+(RUSH_TIERS[val("rush")]||0)));
  return p;
}
const fmtDate = d=>d?new Date(d+"T00:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"}):"";
function fmtTime(t){ if(!t) return ""; const [h,m]=t.split(":").map(Number); return `${(h%12)||12}:${String(m).padStart(2,"0")} ${h<12?"AM":"PM"}`; }

function orderText(){
  const s = pick(), T={vfx:"VFX",cover:"COVER ART",book:"BOOKING",consult:"ESTIMATE REQUEST"}[S.type];
  const logo = {yes:"Has a logo: "+val("logolink"), make:`Needs a logo made (+${usd(LOGO_FEE)})`, no:"No logo needed"}[val("haslogo")]||"";
  const L = [S.type==="consult"?`RO6IE · ${T}`:`RO6IE ORDER · ${T}`, "",
    `Name: ${val("name")}`, val("brand")?`Artist/business: ${val("brand")}`:"", `Phone: ${val("phone")}`,
    val("ig")?`IG: ${val("ig")}`:"", val("email")?`Email: ${val("email")}`:"", logo, "",
    s?`Service: ${s.n}`:"",
    val("song")?`Title: ${val("song")}`:"",
    S.type==="consult"&&val("forwho")?`For: ${val("forwho")}`:"",
    S.type==="consult"&&val("budget")?`Budget: ${val("budget")}`:"",
    S.type==="book"&&val("date")?`Date: ${fmtDate(val("date"))}${val("time")?" at "+fmtTime(val("time")):""}`:"",
    s&&s.x?`Hours: ${Math.ceil(Number(val("hours"))||s.bh)}`:"",
    val("where")?`Location: ${val("where")}`:"",
    val("due")?`Needed by: ${fmtDate(val("due"))}`:"",
    val("rush")?`Rush: ${val("rush")==="24"?"within 24 hrs (+50%)":"under 72 hrs (+25%)"}`:"",
    val("files")?`${S.type==="vfx"?"Footage":"Files"}: ${val("files")}`:"",
    FILES.length?`Uploaded: ${FILES.length} file${FILES.length===1?"":"s"} (${FILES.map(f=>f.name).join(", ")})`:"",
    S.type==="vfx"?"Folder has all clips + audio: yes":"",
    S.type==="cover"?"Reference images are good quality: yes":"",
    "", S.type==="consult"?`What I need: ${val("need")}`:(val("notes")?`Notes: ${val("notes")}`:""),
    "", S.type==="consult"?"Asking for an estimate.":`Estimate: ${usd(estimate())}${s&&s.plus?"+":""}`];
  return L.filter((x,i,a)=>x!=="" || (a[i-1]!=="" && i>0)).join("\n").trim();
}

function validate(){
  const errs = [];
  const need = (id,msg)=>{ if(!String(val(id)).trim()) errs.push([id,msg]); };
  if(S.type==="consult") need("need","Tell Will what you need");
  else if(!val("svc")) errs.push(["svc","Pick a service"]);
  if(S.type==="vfx"||S.type==="cover"){ need("song","Add a title"); if(!FILES.length && !String(val("files")).trim()) errs.push(["files","Add a link or upload your files below"]); if(!val("filesok")) errs.push(["filesok","Check this box to continue"]); }
  else if(S.type==="book") need("date","Pick a date");
  const f=String(val("files")).trim(); if(f && !/\S+\.\S+/.test(f)) errs.push(["files","That doesn't look like a link. Paste the full link."]);
  need("name","Add your name");
  need("phone","Add your phone number");
  if(CAN_SEND && totalUp()>MAX_UP) errs.push(["up",`Your uploads are ${kb(totalUp())}. The limit is 10 MB, so remove big videos and paste a Dropbox or Drive link instead.`]);
  if(val("haslogo")==="yes") need("logolink","Add a link to your logo");
  document.querySelectorAll("[data-f]").forEach(el=>{ el.classList.remove("err"); const m=el.querySelector(".msg"); if(m) m.textContent=""; });
  errs.forEach(([id,msg])=>{ const el=document.querySelector(`[data-f="${id}"]`); if(el){ el.classList.add("err"); const m=el.querySelector(".msg"); if(m) m.textContent=msg; } });
  if(errs.length){ const first=document.querySelector(`[data-f="${errs[0][0]}"]`); first&&first.scrollIntoView({behavior:"smooth",block:"center"}); toast(errs[0][1]); }
  return !errs.length;
}

function review(){
  const t = orderText(), consult = S.type==="consult", s = pick();
  const sms = `sms:${SMS_TO}?&body=${encodeURIComponent(t)}`;
  return `<div><button class="btn sm" id="back">← Edit</button></div>
  <div><h1>${consult?"Ask for an estimate":"Send your order"}</h1><p class="lede">${consult?"Text this to Will and he'll get back to you with a price.":"Text your order to Will. Your spot is locked in once he confirms and payment is in."}</p></div>
  ${CAN_SEND?`<section class="card review">
    <h2>Check your order<small>This is exactly what Will gets.</small></h2>
    <pre class="summary" id="sum">${esc(t)}</pre>
    ${FILES.length?`<span class="note">${FILES.length} file${FILES.length===1?"":"s"} attached (${kb(totalUp())})</span>`:""}
    <button class="btn primary big" id="send">${consult?"Send request to Will":"Send order to Will"}</button>
    <span class="note">Sends your order${FILES.length?" and files":""} straight to Will's email and phone. You'll see a confirmation next.</span>
  </section>`:`<section class="card review">
    <h2>1. Text it to Will<small>${esc(PAY.apple)}</small></h2>
    <pre class="summary" id="sum">${esc(t)}</pre>
    <div class="row"><button class="btn primary" id="copy">Copy order</button></div>
    <div class="textto"><span class="k">Text it to</span><span class="v">${esc(PAY.apple)}</span><button class="btn sm" data-copy="${PAY.apple}">Copy number</button></div>
    <span class="note">Copy your order, open Messages, paste it in a text to ${esc(PAY.apple)} and hit send.${FILES.length?` Then attach the ${FILES.length} file${FILES.length===1?"":"s"} you picked to the same text.`:""}</span>
    <textarea id="fallback" hidden readonly style="width:100%;min-height:160px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;font-family:var(--mono);font-size:12.5px"></textarea>
  </section>`}
  ${CAN_SEND?"":`  ${consult?`<section class="card"><h2>2. Wait for your estimate<small>No payment yet. Will texts you a price and a plan.</small></h2></section>`:`
  <section class="card">
    <h2>2. Pay<small>Estimate ${usd(estimate())}${s&&s.plus?"+":""}. Put your name and service in the payment note.</small></h2>
    <div class="paygrid">
      <div class="payopt"><b>PayPal</b><a class="btn pay" href="${esc(PAY.paypal)}" target="_blank" rel="noopener">Pay with PayPal</a></div>
      <div class="payopt"><b>Cash App</b><span class="v">${esc(PAY.cashapp)}</span><div class="row"><a class="btn sm" href="https://cash.app/${encodeURIComponent(PAY.cashapp)}" target="_blank" rel="noopener">Open Cash App</a><button class="btn sm" data-copy="${esc(PAY.cashapp)}">Copy</button></div></div>
      <div class="payopt"><b>Apple Pay</b><span class="v">${esc(PAY.apple)}</span><span class="note">Send with Apple Cash in Messages to this number.</span><button class="btn sm" data-copy="${esc(PAY.apple)}">Copy number</button></div>
    </div>
  </section>`}`}
  <footer class="foot">Ro6ie · ${CONTACT.ig} · ${esc(PAY.apple)}</footer>`;
}
function payBlock(est,plus){
  return `<div class="paygrid">
      <div class="payopt"><b>PayPal</b><a class="btn pay" href="${esc(PAY.paypal)}" target="_blank" rel="noopener">Pay with PayPal</a></div>
      <div class="payopt"><b>Cash App</b><span class="v">${esc(PAY.cashapp)}</span><div class="row"><a class="btn sm" href="https://cash.app/${encodeURIComponent(PAY.cashapp)}" target="_blank" rel="noopener">Open Cash App</a><button class="btn sm" data-copy="${esc(PAY.cashapp)}">Copy</button></div></div>
      <div class="payopt"><b>Apple Pay</b><span class="v">${esc(PAY.apple)}</span><span class="note">Send with Apple Cash in Messages to this number.</span><button class="btn sm" data-copy="${esc(PAY.apple)}">Copy number</button></div>
    </div>`;
}
function sentView(q){
  const consult = q.get("t")==="consult", est = Number(q.get("est"))||0, name = q.get("n")||"";
  return `<img class="hero" src="${HERO}" alt="Ro6ie poster art">
  <div><h1>${consult?"Request sent":"Order sent"}</h1><p class="lede">${name?esc(name)+", w":"W"}ill got your ${consult?"request":"order"} and will text you back${consult?" with an estimate":" to confirm"}.</p></div>
  ${consult?`<section class="card"><h2>What's next<small>No payment yet. Will texts you a price and a plan.</small></h2></section>`:`
  <section class="card"><h2>Pay to lock it in<small>${est?`Estimate ${usd(est)}. `:""}Put your name and service in the payment note.</small></h2>${payBlock()}</section>`}
  <div><a class="btn" href="${location.pathname}">Start another order</a></div>
  <footer class="foot">Ro6ie · ${CONTACT.ig} · ${esc(PAY.apple)}</footer>`;
}
function sendOrder(){
  const t = orderText(), s = pick();
  const F = document.createElement("form");
  F.method="POST"; F.enctype="multipart/form-data"; F.acceptCharset="UTF-8";
  F.action = "https://formsubmit.co/" + SEND_TO;
  const add=(k,v)=>{ if(v===""||v==null) return; const i=document.createElement("input"); i.type="hidden"; i.name=k; i.value=v; F.appendChild(i); };
  const T={vfx:"VFX",cover:"Cover art",book:"Booking",consult:"Estimate request"}[S.type];
  add("_subject", `New Ro6ie ${T.toLowerCase()}: ${val("name")}${s?" · "+s.n:""}`);
  add("_template","box"); add("_captcha","false");
  if(SEND_CC) add("_cc", SEND_CC);
  if(val("email")) add("_replyto", val("email"));
  const next = new URL(location.href); next.hash=""; next.search="";
  next.searchParams.set("sent","1"); next.searchParams.set("t",S.type); next.searchParams.set("est",String(estimate())); next.searchParams.set("n",val("name"));
  add("_next", next.toString());
  add("Type", T); add("Name", val("name")); add("Phone", val("phone")); add("Email", val("email")); add("Instagram", val("ig"));
  add("Service", s?s.n:""); add("Estimate", S.type==="consult"?"Asking for estimate":usd(estimate())+(s&&s.plus?"+":""));
  add("Full order", t);
  let attached = 0;
  FILES.forEach((f,i)=>{ try{ const dt=new DataTransfer(); dt.items.add(f); const inp=document.createElement("input"); inp.type="file"; inp.name="attachment"+(i+1); inp.files=dt.files; F.appendChild(inp); attached++; }catch(_){} });
  if(FILES.length && attached<FILES.length) add("Note", "Some files couldn't attach from this browser. Ask the client to text them.");
  F.style.display="none"; document.body.appendChild(F);
  F.submit();
}

function render(){
  const app = $("#app");
  const q = new URLSearchParams(location.search);
  if(q.get("sent")==="1"){ app.innerHTML = sentView(q); $("#bar").hidden=true; return; }
  if(S.step==="review"){ app.innerHTML = review(); $("#bar").hidden=true; window.scrollTo(0,0); return; }
  $("#bar").hidden=false;
  app.innerHTML = `
  <img class="hero" src="${HERO}" alt="Ro6ie poster art: a planet with a gold ring over a red-and-black drawn portrait">
  <div><h1>Start an order</h1><p class="lede">Pick what you need, drop your files and directions, and text it to Will in one tap.</p></div>
  <div class="picks" role="group" aria-label="Service type">
    <button class="pick" data-type="vfx" aria-pressed="${S.type==="vfx"}"><b>VFX</b><span>Send your clips and audio, get an edited video back</span><span class="from">from $200</span></button>
    <button class="pick" data-type="cover" aria-pressed="${S.type==="cover"}"><b>Cover art</b><span>Send inspo and references, get your cover</span><span class="from">from $150</span></button>
    <button class="pick" data-type="book" aria-pressed="${S.type==="book"}"><b>Book</b><span>Shoots, music videos, reels, vlogs, packages</span><span class="from">from $150</span></button>
    <button class="pick" data-type="consult" aria-pressed="${S.type==="consult"}"><b>Something else</b><span>Not listed? Describe it and get an estimate</span><span class="from">free</span></button>
  </div>
  ${S.type==="vfx"?vfxForm():S.type==="cover"?coverForm():S.type==="book"?bookForm():consultForm()}
  <footer class="foot">Questions first? DM ${CONTACT.ig} for a consultation.</footer>`;
  updateTotal();
}
function updateTotal(){ const s=pick(); $("#total").textContent = S.type==="consult" ? "Free" : usd(estimate()) + (s&&s.plus?"+":""); $("#go").textContent = S.type==="consult" ? "Review request" : "Review order"; }

document.addEventListener("input", e=>{
  const t=e.target; if(!t.id) return;
  if(["fallback","up"].includes(t.id)) return;
  S.v[t.id] = t.type==="checkbox" ? t.checked : t.value;
  const f=t.closest("[data-f]"); if(f){f.classList.remove("err"); const m=f.querySelector(".msg"); if(m) m.textContent="";}
  updateTotal();
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.id==="up"){ if(t.files&&t.files.length) addFiles([...t.files]); return; }
  if(t.type==="radio"){ S.v[t.name]=t.value; const f=t.closest("[data-f]"); f&&f.classList.remove("err"); updateTotal(); }
  if(t.id==="svc"||t.id==="haslogo"){ S.v[t.id]=t.value; render(); const el=$("#"+t.id); el&&el.focus(); }
});
document.addEventListener("click", async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.type){ if(S.type!==b.dataset.type){ S.type=b.dataset.type; S.v.svc=""; S.v.filesok=false; } render(); return; }
  if(b.dataset.unfile){ const f=FILES.splice(Number(b.dataset.unfile),1)[0]; try{URL.revokeObjectURL(f._url)}catch(_){} render(); return; }
  if(b.id==="share"){
    const text = orderText();
    try{
      const data = {title:"Ro6ie order", text};
      if(FILES.length && navigator.canShare && navigator.canShare({files:FILES})) data.files = FILES.slice();
      if(!navigator.share) throw new Error("no share");
      await navigator.share(data);
      toast(data.files?"Sent to your share menu. Pick Messages → Will.":"Pick Messages → Will to send.");
      if(FILES.length && !data.files){ toast("Attach your files to the same text"); }
    }catch(err){
      if(err && err.name==="AbortError") return;
      try{ await navigator.clipboard.writeText(text); toast(FILES.length?"Copied. Text it to "+PAY.apple+" and attach your files.":"Copied. Paste it in a text to "+PAY.apple); }
      catch(_){ const ta=$("#fallback"); ta.hidden=false; ta.value=text; ta.focus(); ta.select(); toast("Select the text and copy it"); }
    }
    return;
  }
  if(b.id==="send"){ b.disabled=true; b.textContent="Sending…"; sendOrder(); return; }
  if(b.id==="go"){ if(validate()){ S.step="review"; render(); } return; }
  if(b.id==="back"){ S.step="form"; render(); return; }
  if(b.id==="copy" || b.dataset.copy){
    const txt = b.dataset.copy || orderText();
    try{ await navigator.clipboard.writeText(txt); toast(b.dataset.copy?"Copied":"Copied. Paste it in a text to "+PAY.apple); }
    catch(_){ if(b.id==="copy"){ const ta=$("#fallback"); ta.hidden=false; ta.value=txt; ta.focus(); ta.select(); toast("Select the text and copy it"); } else toast("Press and hold to copy"); }
  }
});
document.addEventListener("dragover", e=>{ if(e.target.closest&&e.target.closest("#dropzone")){ e.preventDefault(); e.target.closest("#dropzone").classList.add("over"); } });
document.addEventListener("dragleave", e=>{ const z=e.target.closest&&e.target.closest("#dropzone"); z&&z.classList.remove("over"); });
document.addEventListener("drop", e=>{ const z=e.target.closest&&e.target.closest("#dropzone"); if(z){ e.preventDefault(); if(e.dataTransfer.files.length) addFiles([...e.dataTransfer.files]); } });
render();
</script>
